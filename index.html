<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Maham's Nest ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root { --pink: #ff85a2; --dark-pink: #d14d72; --bg: #fff0f3; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; font-family: 'Quicksand', sans-serif; background-color: var(--bg); overflow-x: hidden; }
        #login-screen { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 2000; }
        #main-content { display: none; padding: 20px; text-align: center; padding-bottom: 100px; }
        .card { background: white; padding: 20px; border-radius: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.05); margin: 15px auto; max-width: 500px; border: 1px solid #ffe4e9; }
        .btn { background: white; border: 2px solid var(--pink); color: var(--dark-pink); padding: 10px 18px; border-radius: 50px; font-weight: bold; margin: 5px; cursor: pointer; transition: 0.3s; font-family: 'Quicksand'; }
        .btn-main { background: var(--pink); color: white; border: none; font-size: 1.1rem; box-shadow: 0 4px 12px rgba(255,133,162,0.4); }
        #timer { font-size: 1.2rem; color: var(--dark-pink); font-weight: bold; margin: 10px 0; }
        .jar-container { cursor: pointer; transition: transform 0.2s; display: inline-block; }
        #jar-text { font-family: 'Dancing Script'; font-size: 1.4rem; color: var(--dark-pink); margin-top: 10px; min-height: 2.5em; padding: 0 10px; transition: 0.3s; }
        #game-box { width: 100%; height: 350px; background: #fff; border-radius: 20px; border: 3px solid var(--pink); position: relative; overflow: hidden; margin-top: 15px; display: none; }
        #game-canvas { width: 100%; height: 100%; touch-action: none; }
        #memory-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 10px; display: none; }
        .memory-card { height: 60px; background: var(--pink); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; color: transparent; cursor: pointer; }
        .memory-card.flipped { background: white; border: 2px solid var(--pink); color: initial; }
        #scratch-container { position: relative; width: 280px; height: 150px; margin: 0 auto; touch-action: none; }
        #scratch-canvas { position: absolute; top: 0; left: 0; z-index: 2; border-radius: 10px; }
        .scratch-content { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #fff; display: flex; align-items: center; justify-content: center; border-radius: 10px; font-weight: bold; font-size: 0.9rem; color: var(--dark-pink); border: 2px solid var(--pink); padding: 15px; text-align: center; box-sizing: border-box; }
        #compliment-pop { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0); background: var(--pink); color: white; padding: 25px; border-radius: 30px; font-family: 'Dancing Script'; font-size: 1.6rem; z-index: 1500; transition: 0.4s; width: 80%; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        #comic-img { width: 100%; border-radius: 15px; margin-top: 10px; display: none; border: 4px solid white; max-width: 500px; }
    </style>
</head>
<body>

    <audio id="bgMusic" src="oursong.mp3" loop></audio>

    <div id="login-screen">
        <div class="card">
            <p style="color: var(--dark-pink); font-weight: bold;">Hint: our first baby</p>
            <input type="password" id="passInput" placeholder="Password..." style="padding: 12px; border-radius: 15px; border: 2px solid var(--pink); width: 80%; text-align: center; outline: none;">
            <br><br>
            <button class="btn btn-main" onclick="checkPass()">Unlock My Heart 🔑</button>
        </div>
    </div>

    <div id="main-content">
        <h1 style="font-family: 'Dancing Script'; color: var(--dark-pink); font-size: 2.5rem; margin:0;">Maham's Nest ❤️</h1>
        <div id="timer">Loading...</div>

        <div class="card">
            <h3 style="color: var(--dark-pink); margin:0;">The Reasons Jar 🏺</h3>
            <div class="jar-container" onclick="pullReason()">
                <span style="font-size: 5rem;">🏺</span>
            </div>
            <div id="jar-text">Tap the jar (or shake your phone!)</div>
        </div>

        <div class="card">
            <h4 style="margin:0; color:var(--dark-pink)">Your Daily Bouquet 💐</h4>
            <div id="bouquet-shelf" style="font-size: 2rem; margin-top:10px;">🌸</div>
        </div>

        <button class="btn" onclick="toggleComic()">📖 Our Story</button>
        <center><img id="comic-img" src="comic.png"></center>

        <div class="card">
            <h3 style="color: var(--dark-pink);">Love Arcade 🎮</h3>
            <button class="btn" onclick="startGame('hearts')">🐶 Catcher</button>
            <button class="btn" onclick="startMemory()">🧩 Puzzle</button>
            <div id="game-box">
                <canvas id="game-canvas"></canvas>
                <div id="memory-grid"></div>
                <div id="game-ui" style="position:absolute; top:10px; left:10px; font-weight:bold; color:var(--dark-pink);">Score: 0</div>
            </div>
        </div>

        <div class="card">
            <h3 style="color: var(--dark-pink);">Trivia ❓</h3>
            <p id="trivia-q">Ready to test your love?</p>
            <div id="trivia-options"></div>
            <button class="btn btn-main" id="trivia-btn" onclick="nextTrivia()">Start Quiz</button>
        </div>

        <div class="card">
            <h3 style="color: var(--dark-pink);">Scratch-Off 🎫</h3>
            <div id="scratch-container">
                <div class="scratch-content">HIIIIII im always praying and thinking about u mahiii ur always in my heart</div>
                <canvas id="scratch-canvas" width="280" height="150"></canvas>
            </div>
        </div>

        <button class="btn btn-main" style="width: 90%; padding: 20px;" onclick="showCompliment()">💖 Compliment Me 💖</button>
    </div>

    <div id="compliment-pop"></div>

    <script>
        // ANNIVERSARY (Year, Month Index 0-11, Day, Hour, Minute)
        const startDate = new Date(2023, 0, 15, 12, 0); 

        const reasons = [
            "I love your eyes; I could get lost in them for hours and wouldn't mind never finding my way back.",
            "Your smile is adorable, especially when those dimples form—it melts my tough act instantly.",
            "Your kindness is unmatched. You accepted me exactly as I am without judgment.",
            "Talking to you feels like laying my head in your lap, no matter the distance.",
            "I can't wait to see you raise our babies with your beautiful eyes.",
            "I love how you always think for me and put 'us' first.",
            "The way you say my name makes my heart skip a beat every single time."
        ];

        const triviaData = [
            { q: "What was the first thing Omar thought when he saw Maham?", a: ["She's alright.", "Who is this?", "She's mean.", "I'm going to marry that girl."], correct: 3 },
            { q: "What can Omar NEVER keep his eyes off of?", a: ["His phone.", "Video games.", "Maham's stunning face.", "Food."], correct: 2 },
            { q: "Why is Maham the most perfect woman in the world?", a: ["Hardworking.", "Gorgeous.", "She's all mine.", "All of the above."], correct: 3 },
            { q: "Who is the luckiest bird in the world?", a: ["Omar (for having Maham).", "Maham.", "Birds in the park.", "Nobody."], correct: 0 }
        ];

        let currentT = 0;
        function nextTrivia() {
            const q = triviaData[currentT];
            document.getElementById('trivia-q').innerText = q.q;
            const opt = document.getElementById('trivia-options');
            opt.innerHTML = '';
            q.a.forEach((text, i) => {
                const b = document.createElement('button'); b.className = 'btn'; b.innerText = text;
                b.onclick = () => {
                    if(i === q.correct) {
                        confetti(); currentT++;
                        if(currentT < triviaData.length) nextTrivia();
                        else document.getElementById('trivia-q').innerText = "Trivia Queen! 👑";
                    } else { alert("Try again, babe!"); }
                };
                opt.appendChild(b);
            });
            document.getElementById('trivia-btn').style.display = 'none';
        }

        function pullReason() {
            const text = document.getElementById('jar-text');
            text.innerText = reasons[Math.floor(Math.random() * reasons.length)];
            confetti({ particleCount: 40, spread: 50, origin: { y: 0.6 } });
        }

        let lastShake = 0;
        window.addEventListener('devicemotion', (e) => {
            let acc = e.accelerationIncludingGravity;
            let total = Math.abs(acc.x) + Math.abs(acc.y) + Math.abs(acc.z);
            if (total > 25 && (Date.now() - lastShake > 2000)) {
                lastShake = Date.now();
                pullReason();
            }
        });

        function checkPass() {
            if(document.getElementById('passInput').value.toLowerCase() === "octopussy") {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('main-content').style.display = 'block';
                document.getElementById('bgMusic').play();
                initScratch();
                initBouquet();
                setInterval(updateTimer, 1000);
            } else { alert("Wrong password!"); }
        }

        function updateTimer() {
            const diff = new Date() - startDate;
            const d = Math.floor(diff / 86400000);
            const h = Math.floor((diff / 3600000) % 24);
            const m = Math.floor((diff / 60000) % 60);
            const s = Math.floor((diff / 1000) % 60);
            document.getElementById('timer').innerText = `${d}d ${h}h ${m}m ${s}s Together`;
        }

        function initBouquet() {
            const flowers = ["🌸", "🌹", "🌷", "🌻", "🌺", "🌼"];
            const day = Math.floor(new Date() / 86400000);
            document.getElementById('bouquet-shelf').innerText = flowers.slice(0, (day % 6) + 1).join("");
        }

        function showCompliment() {
            const comps = ["My brown sugar", "Sexy mami", "Hardworking queen", "Stunningly pretty", "My whole world"];
            const pop = document.getElementById('compliment-pop');
            pop.innerText = comps[Math.floor(Math.random() * comps.length)];
            pop.style.transform = "translate(-50%, -50%) scale(1)";
            confetti({ particleCount: 150 });
            setTimeout(() => pop.style.transform = "translate(-50%, -50%) scale(0)", 2000);
        }

        function toggleComic() { const img = document.getElementById('comic-img'); img.style.display = img.style.display==='block'?'none':'block'; }

        // Game Engines
        let gameActive = false; let pX = 150;
        const canvas = document.getElementById('game-canvas'); const ctx = canvas.getContext('2d');
        function startGame(mode) {
            gameActive = true; document.getElementById('game-box').style.display = 'block';
            document.getElementById('memory-grid').style.display = 'none'; canvas.style.display = 'block';
            canvas.width = canvas.offsetWidth; canvas.height = canvas.offsetHeight;
            loop();
        }
        canvas.addEventListener('touchmove', (e) => { 
            const rect = canvas.getBoundingClientRect();
            pX = e.touches[0].clientX - rect.left;
            e.preventDefault();
        }, {passive:false});
        function loop() {
            if(!gameActive) return;
            ctx.clearRect(0,0,canvas.width,canvas.height);
            ctx.font = "40px Arial"; ctx.fillText("🐶", pX-20, canvas.height-20);
            requestAnimationFrame(loop);
        }
        function startMemory() {
            document.getElementById('game-box').style.display = 'block'; canvas.style.display = 'none';
            const grid = document.getElementById('memory-grid'); grid.style.display = 'grid'; grid.innerHTML = '';
            const icons = ['💎','💍','💖','🌙','🍭','🌹','🦋','🌈'];
            [...icons, ...icons].sort(()=>Math.random()-0.5).forEach(icon => {
                const div = document.createElement('div'); div.className = 'memory-card'; div.innerText = icon;
                div.onclick = () => { div.classList.add('flipped'); if(document.querySelectorAll('.flipped').length % 2 === 0) confetti(); };
                grid.appendChild(div);
            });
        }
        function initScratch() {
            const sc = document.getElementById('scratch-canvas'); const sctx = sc.getContext('2d');
            sctx.fillStyle = '#C0C0C0'; sctx.fillRect(0,0,280,150);
            let down = false;
            const scr = (e) => {
                if(!down) return; const r = sc.getBoundingClientRect();
                const x = (e.clientX || e.touches[0].clientX) - r.left;
                const y = (e.clientY || e.touches[0].clientY) - r.top;
                sctx.globalCompositeOperation = 'destination-out';
                sctx.beginPath(); sctx.arc(x,y,20,0,6.28); sctx.fill();
            };
            sc.addEventListener('mousedown', () => down=true); sc.addEventListener('mouseup', () => down=false);
            sc.addEventListener('mousemove', scr); sc.addEventListener('touchstart', (e) => { down=true; e.preventDefault(); });
            sc.addEventListener('touchmove', (e) => { scr(e); e.preventDefault(); });
        }
    </script>
</body>
</html>
